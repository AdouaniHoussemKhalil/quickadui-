name: CI
 
on:
  pull_request:
  push:
    branches: [main]
 
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history, every branch) is required here, not
      # just a couple of commits: the build step below compares against
      # `origin/main` via `--filter=...[origin/main]`, and on a
      # `pull_request` run actions/checkout only fetches the PR's own ref
      # by default — `origin/main` doesn't exist locally at all unless the
      # whole history/all branches are fetched. A shallow fetch-depth (we
      # had 2) made that comparison fail immediately with exit code 1 on
      # any PR whose base isn't in the shallow history — e.g. the
      # "Version Packages" PR that changesets/action opens, which broke
      # its CI check. Full history is fine here; this is a small repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - uses: pnpm/action-setup@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
 
      - run: pnpm install --frozen-lockfile
 
      # Run once from the repo root, not per-package via `turbo run lint`.
      # Each package's own "lint" script runs `biome check .` with its cwd
      # set to that package's own directory (that's just how turbo/pnpm
      # dispatch a workspace script) — and Biome 2.5.13 doesn't reliably
      # apply the ROOT biome.json's settings when invoked that way: the
      # formatter silently falls back to its own default (indentStyle:
      # "tab", not this repo's configured "space"), and `biome-ignore`
      # suppression comments stop attaching to the rule they're meant to
      # suppress. Both symptoms disappear when cwd == the directory the
      # config file actually lives in, which is exactly the case here,
      # since Biome doesn't yet have real monorepo-awareness (nested
      # configs resolved per package) — see biomejs/biome#2228. One
      # repo-wide pass is also fast enough (well under a second for this
      # whole tree) that losing per-package incrementality for lint alone
      # isn't a real cost.
      - run: pnpm exec biome check .
 
      # Turborepo builds/tests only what changed relative to main —
      # see the QuickadUI Blueprint, §12.
      - run: pnpm turbo run typecheck test build --filter=...[origin/main]